<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Statement Shortlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Instrument+Serif&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3efe6; --card:#fffdf8; --ink:#1d2433; --muted:#5d6676; --line:#ddd5c5; --soft:#ebe5d8;
  --accent:#8a1c2b; --accent-ink:#fff; --gold:#a8771c; --gold-soft:#f6e7c4; --green:#2f6f4f; --green-soft:#dcefe3;
  --flag:#c2410c; --flag-soft:#fde4d6; --blue:#2b5c8a; --blue-soft:#dde8f3; --shadow:0 1px 2px rgba(29,36,51,.08),0 6px 18px rgba(29,36,51,.06);
  --amber:#8a5a00; --amber-soft:#f8e8c4; --red:#b3261e; --red-soft:#fbe1de;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme=light]){
  --bg:#141821; --card:#1c2230; --ink:#ece7dc; --muted:#a3abba; --line:#313a4b; --soft:#232a3a;
  --accent:#e0606f; --accent-ink:#141821; --gold:#e2b553; --gold-soft:#3a3120; --green:#6cc49a; --green-soft:#1d3329;
  --flag:#f08a55; --flag-soft:#3b2519; --blue:#7fb0e0; --blue-soft:#1d2b3c; --shadow:0 1px 2px rgba(0,0,0,.3);
  --amber:#e9b949; --amber-soft:#3a3120; --red:#f2837a; --red-soft:#3d1f1d; color-scheme:dark; }}
:root[data-theme=dark]{
  --bg:#141821; --card:#1c2230; --ink:#ece7dc; --muted:#a3abba; --line:#313a4b; --soft:#232a3a;
  --accent:#e0606f; --accent-ink:#141821; --gold:#e2b553; --gold-soft:#3a3120; --green:#6cc49a; --green-soft:#1d3329;
  --flag:#f08a55; --flag-soft:#3b2519; --blue:#7fb0e0; --blue-soft:#1d2b3c; --shadow:0 1px 2px rgba(0,0,0,.3);
  --amber:#e9b949; --amber-soft:#3a3120; --red:#f2837a; --red-soft:#3d1f1d; color-scheme:dark; }
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Public Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;min-height:100vh}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 120px}
.lab{font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:var(--muted)}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400}
h1.serif{font-size:42px;line-height:1}
h2.serif{font-size:30px;line-height:1.05}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* top bar */
.bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:env(safe-area-inset-top,0) 0 0}
.bar .in{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:'Instrument Serif',serif;font-size:22px;line-height:1;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.clock{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:30px;font-variant-numeric:tabular-nums;line-height:1}
.clock.warn{color:var(--gold)} .clock.danger{color:var(--accent)}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;font-size:18px;flex:0 0 auto}
.iconbtn.sm{width:44px;height:44px;font-size:15px}
.bar .in:has(.clock:not(:empty)) .brand{font-size:18px}
/* cards & buttons */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:13px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink);min-height:48px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:8px 12px;min-height:38px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.field{display:block;margin-top:12px}
.field input,.field select,textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:var(--card);font-size:16px}
textarea{min-height:92px;resize:vertical;line-height:1.45}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:14px}
.note{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:14px;margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;background:var(--soft)}
.pill.gold{background:var(--gold-soft);color:var(--gold)} .pill.red{background:var(--flag-soft);color:var(--flag)}
.pill.green{background:var(--green-soft);color:var(--green)} .pill.blue{background:var(--blue-soft);color:var(--blue)}
ul.clean{list-style:none} ul.clean li{padding:6px 0;border-bottom:1px dashed var(--line)} ul.clean li:last-child{border:0}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px}
/* tabs */
.tabs{display:flex;gap:6px;background:var(--soft);padding:4px;border-radius:12px;margin-top:14px}
.tabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:700;font-size:15px;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.ph{background:var(--soft);display:inline-grid;place-items:center;color:var(--muted);font-family:'Instrument Serif',serif;font-size:22px}
/* file list */
.flist{list-style:none;margin-top:6px}
.ftile{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px 10px 10px;margin-top:8px;box-shadow:var(--shadow)}
.ftile .ph{width:48px;height:60px;border-radius:9px;flex:0 0 auto}
.ftile .mid{flex:1;min-width:0}
.ftile .mid b{display:block;font-size:17px;line-height:1.2}
.ftile .mid small{display:block;font-size:13px;color:var(--muted)}
.ftile .go{font-size:24px;color:var(--muted)}
.ftile .chips{margin-top:5px;gap:4px}
.ftile .pill{font-size:12px;padding:2px 8px}
.progline{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:14px;color:var(--muted)}
/* reader */
.rtop{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:8px}
.app-head{display:flex;gap:16px;align-items:flex-start}
.portrait{width:96px;height:120px;border-radius:12px;flex:0 0 auto;border:1px solid var(--line);font-size:40px}
.app-head .who{flex:1;min-width:0}
.app-head .nm{font-family:'Instrument Serif',serif;font-size:36px;line-height:1}
details.prog{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--blue-soft)}
details.prog summary{cursor:pointer;font-size:15px;list-style-position:outside;margin-left:16px}
details.prog summary .lab{color:var(--blue)}
details.prog ul{margin:6px 0 0 18px;font-size:14px}
details.prog li{margin-top:3px}
.sec{margin-top:18px;color:var(--accent)}
.stmt p.para{font-size:17px;line-height:1.75;margin-top:10px}
.parahead{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px}
.u{cursor:pointer;border-radius:4px;padding:1px 1px;-webkit-box-decoration-break:clone;box-decoration-break:clone;text-underline-offset:4px}
@media (hover:hover){ .u:hover{background:var(--soft)} }
.u.open{background:var(--blue-soft);box-shadow:0 0 0 2px var(--blue)}
.u.m-e{background:var(--green-soft);text-decoration:underline solid var(--green) 2px}
.u.m-c{background:var(--amber-soft);text-decoration:underline wavy var(--amber) 1.5px}
.u.m-f{background:var(--red-soft);text-decoration:underline double var(--red) 3px}
.mi{display:inline-block;font-weight:800;margin-right:3px;font-size:.85em}
.m-e .mi{color:var(--green)} .m-c .mi{color:var(--amber)} .m-f .mi{color:var(--red)}
.acts{list-style:none;margin-top:6px}
.acts li{margin-top:8px}
.u.act{display:block;padding:10px 12px;border-left:5px solid var(--line);background:var(--soft);border-radius:8px;text-decoration:none;font-size:16px}
.u.act.m-e{border-left-color:var(--green);background:var(--green-soft)} .u.act.m-c{border-left-color:var(--amber);background:var(--amber-soft)} .u.act.m-f{border-left-color:var(--red);background:var(--red-soft)}
.rzl{display:block;font-size:13px;font-weight:600;color:var(--red);margin-top:2px}
.rzi{display:inline-block;font-size:12px;font-weight:700;color:var(--red);background:var(--card);border:1px solid var(--red);border-radius:999px;padding:0 7px;margin-left:4px;line-height:1.5;text-decoration:none;vertical-align:1px}
.rzi.none,.rzl.none{border-style:dashed}
.mk{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:8px 10px 10px;margin:8px 0 12px}
.mkhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.mkbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.mkb{border:1.5px solid var(--line);border-radius:10px;background:var(--card);padding:9px 2px;font-weight:700;font-size:14px;min-height:44px;white-space:nowrap}
.mkb.mk-e{color:var(--green)} .mkb.mk-c{color:var(--amber)} .mkb.mk-f{color:var(--red)}
.mkb.mk-e[aria-pressed=true]{background:var(--green);border-color:var(--green);color:var(--card)}
.mkb.mk-c[aria-pressed=true]{background:var(--amber);border-color:var(--amber);color:var(--card)}
.mkb.mk-f[aria-pressed=true]{background:var(--red);border-color:var(--red);color:var(--card)}
.reasons{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.chip.rz{width:100%;min-height:44px}
.chip.rz[aria-checked=true]{border-color:var(--red);background:var(--red-soft);color:var(--red);font-weight:700}
.chip.rz[aria-checked=true]::before{content:'● '}
.mchip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 9px;font-weight:700;font-size:14px;border:1.5px solid}
.mchip.m-e{color:var(--green);background:var(--green-soft)} .mchip.m-c{color:var(--amber);background:var(--amber-soft)} .mchip.m-f{color:var(--red);background:var(--red-soft)}
.listen{border:1.5px solid var(--blue);color:var(--blue);background:var(--blue-soft);border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px;white-space:nowrap;min-height:34px}
.listen.playing{background:var(--blue);color:var(--card)}
.toolrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.rankpick{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:12px;padding:4px 4px 4px 12px;background:var(--card);min-height:44px}
.rankpick select{border:0;background:var(--soft);border-radius:9px;padding:6px 8px;font-weight:700}
.nav2{display:flex;justify-content:space-between;margin-top:16px;gap:8px}
/* ranking list */
.rlist{list-style:none;margin-top:8px}
.ritem{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 10px;margin-top:8px}
.ritem .rk{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;width:30px;text-align:center;line-height:1}
.ritem .ph{width:36px;height:45px;border-radius:7px;object-fit:cover;flex:0 0 auto;font-size:16px}
.ritem .mid{flex:1;min-width:0}
.ritem .mid b{display:block;font-size:17px;line-height:1.2}
.ritem .mid small{font-size:13px;color:var(--muted)}
.ritem.s1{border-color:var(--gold);background:linear-gradient(90deg,var(--gold-soft),var(--card) 70%)} .ritem.s1 .rk{color:var(--gold)}
.ritem.s2 .rk,.ritem.s3 .rk{color:var(--accent)}
.ritem.low{opacity:.85} .ritem.low .rk{color:var(--muted)}
.linkbtn{border:0;background:none;padding:6px 0;min-height:32px;font-weight:700;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.mv{display:flex;flex-direction:column;gap:4px}
.mv button{width:44px;height:38px;border:1px solid var(--line);background:var(--soft);border-radius:8px;font-size:14px;line-height:1}
.mv button:disabled{opacity:.3}
.cut{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--muted);font-size:12px;font-family:'Barlow Condensed',sans-serif;letter-spacing:.1em;text-transform:uppercase}
.cut::before,.cut::after{content:'';flex:1;border-top:1.5px dashed var(--line)}
/* sticky action */
.dock{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 16px calc(14px + env(safe-area-inset-bottom,0));z-index:15}
.dock .in{max-width:720px;margin:0 auto;display:flex;gap:10px;align-items:center}
/* compare table */
.tbl{width:100%;border-collapse:collapse;font-size:15px;margin-top:10px}
.tbl th{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;padding:6px 4px;border-bottom:1.5px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:center;font-variant-numeric:tabular-nums}
.tbl td.c{display:flex;align-items:center;gap:8px;font-weight:600}
.tbl td.c .ph{width:28px;height:35px;border-radius:6px;object-fit:cover;font-size:13px}
.tbl tr.split td,.tbl tr.split td:first-child{background:var(--flag-soft)} .tbl tr.agree td,.tbl tr.agree td:first-child{background:var(--green-soft)}
.tscroll{overflow-x:auto;margin:0 -4px;padding:0 4px}
.tbl th.nm{max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl td.c span.fn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:84px}
@media (max-width:420px){ .tbl{font-size:14px} .tbl td,.tbl th{padding-left:2px;padding-right:2px} .tbl td.c .ph{display:none} }
.tbl td:first-child,.tbl th:first-child{position:sticky;left:0;background:var(--card);z-index:1}
.rkcell{display:inline-block;min-width:26px;padding:2px 4px;border-radius:7px;font-weight:700}
.rkcell.top{background:var(--gold-soft);color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 11px;font-size:14px;text-align:left;line-height:1.3}
.chip[aria-pressed=true]{border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:600}
.chip[aria-pressed=true]:not(.rz)::before{content:'✓ '}
.wc{font-size:13px;font-weight:600;margin-top:4px}
.wc.ok{color:var(--green)} .wc.no{color:var(--accent)} .wc.zero{color:var(--muted)}
.member{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.member:last-child{border:0}
.member input{width:22px;height:22px;accent-color:var(--accent)}
/* marks view */
.mvrow{border-top:1px solid var(--line);padding:10px 0}
.mvrow:first-of-type{border-top:0}
.mvtext{font-size:15px;margin-top:2px}
.mvmarks{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.mtag{border-radius:999px;padding:2px 9px;font-size:13px;background:var(--card);border:1.5px solid var(--line)}
.mtag.m-e{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.mtag.m-c{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.mtag.m-f{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.mtag.m-x{border-style:dashed;color:var(--muted)}
.mvrz{font-size:13px;color:var(--red);margin-top:4px}
/* attach */
.attq{border-left:4px solid var(--blue);padding:6px 10px;background:var(--blue-soft);border-radius:8px;margin:8px 0;font-size:14px}
.attq q{display:block;margin-top:2px}
.attlist{list-style:none;margin-top:8px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.attpick{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:var(--card);padding:10px 12px;font-size:14px}
.attlist li:last-child .attpick{border-bottom:0}
.attpick[aria-pressed=true]{background:var(--blue-soft);box-shadow:inset 4px 0 0 var(--blue)}
.attpick .lab{display:block}
/* fix-it */
.tgt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:12px;background:var(--card);padding:10px 12px;margin-top:8px;font-size:15px}
.tgt[aria-pressed=true]{border-color:var(--accent);background:var(--soft);box-shadow:inset 4px 0 0 var(--accent)}
.tgt[disabled]{cursor:default;opacity:1}
.tgt .lab{display:block}
.checks{list-style:none;margin-top:10px}
.checks li{display:flex;gap:8px;padding:3px 0;font-size:14px}
.checks .ic{font-weight:800;width:18px;flex:0 0 auto;text-align:center}
.checks li.ok .ic{color:var(--green)} .checks li.no .ic{color:var(--accent)}
.checks li.no{color:var(--ink)}
.eye{display:flex;gap:16px;align-items:center;margin-top:8px}
.stamp{display:inline-block;border:2.5px solid currentColor;border-radius:8px;padding:2px 10px;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.12em;text-transform:uppercase;transform:rotate(-3deg)}
.stamp.gold{color:var(--gold)} .stamp.red{color:var(--accent)} .stamp.green{color:var(--green)}
.big{font-size:56px;font-family:'Barlow Condensed',sans-serif;font-weight:700;line-height:1}
.center{text-align:center}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.sheet{position:fixed;inset:0;background:rgba(10,12,18,.5);z-index:50;display:none;align-items:flex-end;justify-content:center}
.sheet.show{display:flex}
.sheet .box{background:var(--card);border-radius:20px 20px 0 0;max-width:720px;width:100%;max-height:86vh;overflow:auto;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0))}
.sheet details{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.sheet summary{cursor:pointer;font-weight:700}
.vg{margin-top:8px;font-size:14px}
.offline{background:var(--flag-soft);color:var(--flag);font-size:13px;font-weight:600;text-align:center;padding:6px}
.nomcard{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.nomcard:last-child{border:0}
.nomcard .ph{width:48px;height:60px;border-radius:8px;object-fit:cover;font-size:20px;flex:0 0 auto}
.nomcard > div{min-width:0}
.lb{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
.lb .bar2{flex:1;height:10px;background:var(--soft);border-radius:6px;overflow:hidden}
.lb .bar2 i{display:block;height:100%;background:var(--accent);border-radius:6px}
@media (max-width:380px){ .app-head .nm{font-size:30px} .portrait{width:80px;height:100px} .mkb{font-size:13px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<div class="bar"><div class="in">
  <div class="brand">The Statement Shortlist<small id="sub"></small></div>
  <div class="clock" id="clock" aria-live="off"></div>
  <button class="iconbtn" id="helpBtn" aria-label="Help: what to look for">?</button>
  <button class="iconbtn" id="themeBtn" aria-label="Switch light or dark">☾</button>
</div><div id="offline" class="offline" hidden>Connection lost. Your work is saved on this phone; it will send when the connection returns.</div></div>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" role="status"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Help"><div class="box" id="sheetBox"></div></div>
<footer class="wrap muted" id="foot" style="font-size:12px;padding-bottom:24px"></footer>

<script src="config.js?v=2"></script>
<script src="data/content.js?v=1"></script>
<script src="data/tts.js?v=1"></script>
<script src="js/core.js?v=1"></script>
<script>
'use strict';
const SL = window.SL, FILES = SL.files, BYID = Object.fromEntries(FILES.map(f => [f.id, f]));
const U = (SL.ui && SL.ui.student) || {};
const API = window.API_URL, KEY = 'ss.v1';
const AUDIO = !!(SL.meta && SL.meta.audio);
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const words = s => (String(s || '').trim().match(/\S+/g) || []).length;
const pts = rank => 11 - rank;                       // 1st = 10 points ... 10th = 1 point
const MIN_WORDS = 15, SLOTS = ['s', 'o2', 'o3'], MAX_MARKS = 150, MARK_DEBOUNCE = 20000;
const LATE = ['r3', 'fix', 'done'];
const MARK = Object.fromEntries(SL.markTypes.map(m => [m.id, m]));
const same = (a, b) => String(a || '').toLowerCase() === String(b || '').toLowerCase();
/* every sentence and activity line, by id */
const UNITS = {};
FILES.forEach(f => {
  f.statement.forEach((s, i) => { UNITS[s.id] = { id: s.id, text: s.text, para: s.para, file: f.id, kind: 's', n: i + 1 }; });
  f.activities.forEach((a, i) => { UNITS[a.id] = { id: a.id, text: a.text, file: f.id, kind: 'a', n: i + 1 }; });
});
const unitIds = f => f.statement.map(s => s.id).concat(f.activities.map(a => a.id));
function parasOf(f){
  const m = new Map(); f.statement.forEach(s => { if (!m.has(s.para)) m.set(s.para, []); m.get(s.para).push(s); });
  return [...m.entries()].sort((a, b) => a[0] - b[0]).map(([n, sents]) => ({ n, sents, text: sents.map(s => s.text).join(' ') }));
}
function unitLabel(id){ const u = UNITS[id]; return u.kind === 'a' ? 'Activity line ' + u.n : 'Paragraph ' + u.para + ' · sentence ' + u.n; }

/* ---------- shared core (js/core.js); thin wrappers so a signature change is a one-line fix ---------- */
const CORE = () => window.SSCore || null;
function coreCheckFix(target, text, original){ const C = CORE(); return C && C.checkFix ? C.checkFix(target, text, original, SL) : null; }
function coreMarksView(members, file){
  const C = CORE(); if (!C || !C.marksView) return [];
  const r = C.marksView(members, file) || {};
  return (Array.isArray(r) ? r : r.units || []).map(u => typeof u === 'string' ? u : u.id).filter(id => UNITS[id]);
}

/* ---------- storage (wrapped, with in-memory fallback) ---------- */
const mem = {};
function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return mem[KEY] || {}; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { mem[KEY] = S; } }
let S = load();
function isDark(){ return document.documentElement.getAttribute('data-theme') === 'dark' || (!document.documentElement.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches); }
function themeApply(t){ if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); const b = document.getElementById('themeBtn'); if (b) b.textContent = isDark() ? '☀' : '☾'; }
try { themeApply(localStorage.getItem('ss.theme')); } catch (e) { themeApply(null); }
$('#themeBtn').onclick = () => {
  const t = isDark() ? 'light' : 'dark'; themeApply(t); try { localStorage.setItem('ss.theme', t); } catch (e) {}
};
$('#foot').textContent = U.footer || '';

/* ---------- helpers ---------- */
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
let armedKey = '', armedAt = 0;
function armed(k){ const ok = armedKey === k && Date.now() - armedAt < 6000; armedKey = ok ? '' : k; armedAt = Date.now(); return ok; }
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(el._h); el._h = setTimeout(() => el.classList.remove('show'), 2600); }
function img(f, cls){ return '<span class="ph ' + (cls || '') + '" role="img" aria-label="Portrait of applicant ' + esc(f.name) + '" style="position:relative;overflow:hidden">' + esc(f.name[0]) + '<img src="' + esc(f.portrait || ('art/applicants/' + f.id + '.jpg')) + '" alt="" loading="lazy" onerror="this.remove()" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit"></span>'; }
function tag(rank){ return rank === 1 ? 'Scholarship + place' : rank <= 3 ? 'Place' : rank >= 8 ? 'Bottom 3' : ''; }
function pill(t, cls){ return '<span class="pill ' + (cls || '') + '">' + t + '</span>'; }
function apiReady(){ return API && API.indexOf('PASTE_') !== 0; }
async function api(method, body, params){
  if (!apiReady()) throw new Error('no-api');
  let url = API + (params ? (API.indexOf('?') > -1 ? '&' : '?') + params : '');
  const opt = { method, redirect: 'follow' };
  if (method === 'POST') { opt.headers = { 'Content-Type': 'text/plain;charset=utf-8' }; opt.body = JSON.stringify(body); }
  const r = await fetch(url, opt); return r.json();
}
function editingText(){ const a = document.activeElement; return !!a && (a.tagName === 'TEXTAREA' || a.tagName === 'SELECT' || (a.tagName === 'INPUT' && !/^(checkbox|radio|button|submit)$/i.test(a.type))); }

/* ---------- read-aloud (only when SL.meta.audio): recorded clips from data/tts.js, nothing when a clip is missing ----------
   Clip keys: <fileId>-p<n> = the sentences of paragraph n joined by one space; <fileId>-act = the two activity lines joined by one space. */
function ttsNorm(t){ return String(t).replace(/\s+/g, ' ').trim(); }
function ttsKey(t){ let h = 0x811c9dc5; t = ttsNorm(t); for (let i = 0; i < t.length; i++) { h ^= t.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return ('0000000' + h.toString(16)).slice(-8); }
const TTS = window.TTS || { dir: 'audio/', clips: {} };
let audio = null, playToken = 0, PLAY = null;   // PLAY = {fileId, src: 'all' | 'p1'… | 'act', paused}
function clipText(f, key){ if (key === 'act') return f.activities.map(a => a.text).join(' '); const p = parasOf(f).find(x => 'p' + x.n === key); return p ? p.text : ''; }
function clipKeys(f){ return parasOf(f).map(p => 'p' + p.n).concat(['act']); }
function hasClip(f, key){ const t = clipText(f, key), c = TTS.clips && TTS.clips[f.id + '-' + key]; return !!(AUDIO && t && c && c === ttsKey(t)); }
function stopAudio(){ playToken++; if (audio) { try { audio.pause(); } catch (e) {} audio = null; } PLAY = null; syncListen(); }
function syncListen(){
  document.querySelectorAll('[data-listen]').forEach(b => {
    const on = !!PLAY && PLAY.fileId === S.at && PLAY.src === b.dataset.listen, base = b.dataset.listen === 'all' ? 'Play all' : 'Listen';
    b.textContent = on ? (PLAY.paused ? '▶ Resume' : '❚❚ Pause') : '▶ ' + base;
    b.classList.toggle('playing', on && !PLAY.paused); b.setAttribute('aria-pressed', String(on && !PLAY.paused));
  });
}
function playOne(f, key, token){
  return new Promise(resolve => {
    if (token !== playToken || !hasClip(f, key)) return resolve();
    const clip = TTS.clips[f.id + '-' + key];
    audio = new Audio(TTS.dir + f.id + '-' + key + '.mp3?' + clip + (TTS.cast ? '-' + ttsKey(TTS.cast[f.id] || '') : ''));
    audio.onended = resolve; audio.onerror = () => resolve();
    audio.play().catch(() => resolve());
  });
}
async function listen(f, src){
  if (PLAY && PLAY.fileId === f.id && PLAY.src === src) {             // same button: pause or resume
    PLAY.paused = !PLAY.paused;
    if (audio) { if (PLAY.paused) audio.pause(); else audio.play().catch(() => {}); }
    return syncListen();
  }
  stopAudio(); const token = playToken;
  const keys = src === 'all' ? clipKeys(f).filter(k => hasClip(f, k)) : [src];
  PLAY = { fileId: f.id, src, paused: false }; syncListen();
  for (const k of keys) { if (token !== playToken) return; await playOne(f, k, token); }
  if (token === playToken) stopAudio();
}
function listenBtn(f, key){ return hasClip(f, key) ? '<button class="listen" data-listen="' + key + '" aria-pressed="false" aria-label="Listen to ' + (key === 'act' ? 'the activity list' : 'paragraph ' + key.slice(1)) + '">▶ Listen</button>' : ''; }

/* ---------- server state & clock ---------- */
let ST = { phase: 'lobby', endsAt: 0, running: false, epoch: '1' }, skew = 0, online = true, pollH = null;
const now = () => Date.now() + skew;
function remaining(){ return ST.running && ST.endsAt ? Math.max(0, ST.endsAt - now()) : 0; }
function live(ph){ return ST.phase === ph && ST.running && remaining() > 0; }
function fmt(ms){ const s = Math.ceil(ms / 1000), m = Math.floor(s / 60); return m + ':' + String(s % 60).padStart(2, '0'); }
function renderClock(){
  const el = $('#clock');
  if (S.practice) { el.textContent = ''; return; }
  if (!ST.running || !ST.endsAt) { el.textContent = ''; el.className = 'clock'; return; }
  const r = remaining(); el.textContent = fmt(r); el.className = 'clock' + (r <= 60000 ? ' danger' : r <= 120000 ? ' warn' : '');
  if (r <= 0) onTimeUp();
}
setInterval(renderClock, 250);

async function poll(){
  if (S.practice || !S.name) return schedule();
  try {
    const r = await api('GET', null, 'action=state');
    if (r && r.ok) {
      skew = r.now - Date.now(); setOnline(true);
      const prev = ST.phase, prevEpoch = S.epoch;
      ST = r.state;
      if (prevEpoch && String(ST.epoch) !== String(prevEpoch)) { resetLocal('Your teacher started a new game.'); return schedule(); }
      if (!S.epoch) { S.epoch = String(ST.epoch); save(); }
      onPhase(prev);
      flushOutbox();
    }
  } catch (e) { setOnline(false); }
  schedule();
}
function schedule(){ clearTimeout(pollH); const busy = ST.phase === 'preview' || ['r1', 'r2', 'r3', 'fix'].some(live); pollH = setTimeout(poll, busy ? 12000 : 4000); }
function setOnline(v){ online = v; $('#offline').hidden = v || !apiReady(); }

/* phase change handling */
let lastPhaseShown = null, lastDataShown = null;
function onPhase(prev){
  const r1Over = (prev === 'r1' && ST.phase !== 'r1') || ['r2', 'r3', 'fix', 'done'].includes(ST.phase) || (ST.phase === 'r1' && ST.endsAt && !live('r1'));
  if (r1Over) autoSendR1();
  if (prev === 'preview' && ST.phase !== 'preview') sendMarks(false);
  if ((prev === 'r2' && ST.phase !== 'r2') || (ST.phase === 'r2' && ST.endsAt && !live('r2'))) autoSendPanel();
  const shown = ST.phase + '|' + ST.running, data = !!ST.notes + '|' + JSON.stringify(ST.decision || null) + '|' + JSON.stringify(ST.fixAssign || null);
  if (shown !== lastPhaseShown) {
    lastPhaseShown = shown; lastDataShown = data;
    if (ST.phase === 'r2' || ST.phase === 'fix') loadPanel();
    if (LATE.includes(ST.phase)) loadBoard();
    if (ST.phase === 'fix') loadFix(); else FIX = null;
    render();
  } else if (data !== lastDataShown) {
    lastDataShown = data;
    if (LATE.includes(ST.phase)) loadBoard();
    if (ST.phase === 'fix') loadFix();
    softRender();
  }
}
let timeUpDone = '';
function onTimeUp(){
  const k = ST.phase + ST.endsAt; if (timeUpDone === k) return; timeUpDone = k;
  if (ST.phase === 'preview') sendMarks(false);
  if (ST.phase === 'r1') { autoSendR1(); render(); }
  if (ST.phase === 'r2') { autoSendPanel(); render(); }
}

/* ---------- outbox: every send is retried until the server answers ---------- */
function queue(body){
  const prev = (S.outbox || []).find(b => b.action === body.action);
  // a marks-only save must not replace a ranking that is still waiting to go
  if (prev && body.action === 'individual' && body.order == null && prev.order) { body.order = prev.order; body.auto = prev.auto; }
  S.outbox = (S.outbox || []).filter(b => b.action !== body.action); S.outbox.push(body); save(); flushOutbox();
}
let flushing = false;
async function flushOutbox(){
  if (flushing || !S.outbox || !S.outbox.length || S.practice) return; flushing = true;
  try {
    while (S.outbox && S.outbox.length) {
      const b = S.outbox[0];
      const r = await api('POST', b);
      S.outbox = (S.outbox || []).filter(x => x !== b); save();
      setOnline(true);
      if (r && r.stale) { S.outbox = []; save(); break; }
      if (r && r.ok === false && r.head) { handleHeadClash(r.head); continue; }
      if (r && r.ok === false) { if (!b.auto && b.order !== null) toast(r.error ? 'Not sent: ' + r.error : 'Not sent'); continue; }
      if (b.action === 'individual' && b.order && S.r1) { S.r1.sent = true; S.r1.sentOrder = b.order.slice(); save(); if (!editingText() && !S.at) render(); }
      if (b.action === 'panel') { S.panelSent = true; save(); loadPanel(); }
    }
  } catch (e) { setOnline(false); setTimeout(() => { flushing = false; flushOutbox(); }, 4000 + Math.random() * 4000); return; }
  flushing = false;
}

/* ---------- local state ---------- */
function ensureMarks(){ S.marks = S.marks || {}; S.concerns = S.concerns || {}; S.opened = S.opened || []; }
function ensureDeck(){ ensureMarks(); if (!S.deck) { S.deck = S.r1 ? S.r1.order.slice() : shuffle(FILES.map(f => f.id)); save(); } }
function ensureR1(){ ensureDeck(); if (!S.r1) { S.r1 = { order: S.deck.slice(), moved: 0, sent: false }; save(); } }
function resetLocal(msg){
  S = { lastName: S.name || S.lastName, panel: S.panel }; save(); PANEL = null; BOARD = null; SCORE = null; FIX = null; stopAudio(); lastPhaseShown = null; tab = 'files'; toast(msg || 'New game'); render();
}
function fileMarks(f){ return unitIds(f).filter(u => S.marks[u]).length; }
function flaggedFiles(marks){ const out = []; for (const u in (marks || {})) if (marks[u] === 'f' && UNITS[u] && !out.includes(UNITS[u].file)) out.push(UNITS[u].file); return out; }

/* marks: saved locally at every change; sent (order null) on a debounce and when leaving the reader */
let marksH = null;
function marksOpenNow(){ return !S.practice && !!S.name && (ST.phase === 'preview' || ST.phase === 'r1'); }
function touchMarks(){ S.marksDirty = true; save(); if (S.practice || !S.name) return; clearTimeout(marksH); marksH = setTimeout(() => sendMarks(false), MARK_DEBOUNCE); }
function sendMarks(auto){
  clearTimeout(marksH);
  if (S.practice || !S.name || !S.marksDirty) return;
  if (!auto && !marksOpenNow()) return;
  S.marksDirty = false;
  queue({ action: 'individual', name: S.name, panel: S.panel, order: null, opened: S.opened, marks: S.marks, concerns: S.concerns, auto: !!auto, epoch: S.epoch });
}
function setMark(u, v){
  ensureMarks();
  if (S.marks[u] === v) { delete S.marks[u]; delete S.concerns[u]; }
  else {
    if (!S.marks[u] && Object.keys(S.marks).length >= MAX_MARKS) return toast('You have used all ' + MAX_MARKS + ' marks.');
    S.marks[u] = v; if (v !== 'f') delete S.concerns[u];
  }
  touchMarks();
}
function openFile(id){
  ensureMarks(); if (S.at && S.at !== id) sendMarks(false);
  S.at = id; S.openU = null; tab = 'files';
  if (!S.opened.includes(id)) { S.opened.push(id); touchMarks(); }
  save(); render(); window.scrollTo(0, 0);
}
function leaveReader(){ if (!S.at) return; S.at = null; S.openU = null; save(); sendMarks(false); }

/* ---------- views ---------- */
let tab = 'files', focusAfter = null;
function focusKey(){
  const a = document.activeElement; if (!a || a === document.body) return null;
  if (a.id) return '#' + a.id;
  for (const k of ['data-u', 'data-mk', 'data-rz', 'data-open', 'data-tab', 'data-up', 'data-dn', 'data-rec', 'data-att', 'data-attopen', 'data-tgt', 'data-mvf', 'data-mate', 'data-listen', 'data-sort'])
    if (a.hasAttribute(k)) return '[' + k + '="' + CSS.escape(a.getAttribute(k)) + '"]' + (a.dataset.scope ? '[data-scope="' + a.dataset.scope + '"]' : '');
  return null;
}
function softRender(){ if (!editingText()) render(); }
function render(){
  const fk = focusAfter || focusKey(); focusAfter = null;
  const el = $('#app');
  if (!S.name && !S.practice) { stopAudio(); el.innerHTML = viewJoin(); bindJoin(); $('#sub').textContent = SL.meta.programme; return; }
  if (S.practice) { $('#sub').textContent = 'Solo practice'; el.innerHTML = viewRead('practice'); bindRead('practice'); }
  else {
    $('#sub').textContent = S.name + ' · Panel ' + S.panel;
    if (ST.phase === 'lobby') { el.innerHTML = viewLobby(); bindLobby(); }
    else if (ST.phase === 'preview') { el.innerHTML = viewRead('preview'); bindRead('preview'); }
    else if (ST.phase === 'r1') {
      ensureR1();
      if (S.r1.sent && !live('r1')) { el.innerHTML = viewWait('Your ranking is in.', 'Round 2 starts when your teacher is ready. Sit with your panel.'); bindHelp(); }
      else { el.innerHTML = viewRead('r1'); bindRead('r1'); }
    }
    else if (ST.phase === 'r2') { el.innerHTML = viewR2(); bindR2(); }
    else if (ST.phase === 'fix') { el.innerHTML = viewFix(); bindFix(); }
    else { el.innerHTML = viewR3(); bindHelp(); }
  }
  if (fk) { const n = document.querySelector(fk); if (n) n.focus({ preventScroll: true }); }
  if (PLAY && (S.at !== PLAY.fileId || !document.querySelector('[data-listen]'))) stopAudio(); else syncListen();
}

/* Join */
function viewJoin(){
  let opts = ''; for (let i = 1; i <= 10; i++) opts += '<option value="' + i + '">Panel ' + i + '</option>';
  return '<div class="card" style="margin-top:22px"><div class="lab">' + esc(U.joinKicker) + '</div><h1 class="serif" style="margin-top:6px">The Statement Shortlist</h1>' +
    '<p style="margin-top:10px">' + esc(SL.meta.blurb) + '</p>' +
    '<label class="field"><span class="lab">Your nickname</span><input id="jName" maxlength="20" autocomplete="nickname" placeholder="e.g. Mind" value="' + esc(S.lastName || '') + '"></label>' +
    '<label class="field"><span class="lab">Your panel (group of three)</span><select id="jPanel">' + opts + '</select></label>' +
    '<button class="btn block" id="jGo" style="margin-top:16px">Join the game</button>' +
    '<button class="btn ghost block" id="jSolo" style="margin-top:10px">Solo practice (no class game)</button>' +
    '<p class="note">' + esc(U.joinNote) + '</p></div>';
}
function bindJoin(){
  if (S.panel) $('#jPanel').value = S.panel;
  $('#jGo').onclick = async () => {
    const name = $('#jName').value.trim().replace(/\s+/g, ' ').slice(0, 20), panel = $('#jPanel').value;
    if (!name) return toast('Type your nickname first');
    if (!apiReady()) return toast('The class game is not connected yet. Try Solo practice.');
    $('#jGo').disabled = true;
    try {
      const r = await api('POST', { action: 'register', name, panel });
      if (!r.ok) throw new Error(r.error || 'error');
      const sameGame = S.epoch && String(S.epoch) === String(r.state.epoch);
      const keep = sameGame ? { marks: S.marks, concerns: S.concerns, opened: S.opened, deck: S.deck, r1: S.r1, marksDirty: S.marksDirty } : {};
      S = Object.assign({ name, panel, lastName: name, epoch: String(r.state.epoch) }, keep);
      const sv = r.saved || {};
      if (sv.order && !(S.r1 && S.r1.sent)) { S.r1 = { order: sv.order.slice(), moved: 1, sent: true, sentOrder: sv.order.slice() }; S.deck = S.deck || sv.order.slice(); }
      ensureMarks();
      if (sv.marks && !Object.keys(S.marks).length) { S.marks = sv.marks; S.concerns = sv.concerns || {}; }
      (sv.opened || []).forEach(id => { if (!S.opened.includes(id)) S.opened.push(id); });
      if (Object.keys(S.marks).length || S.opened.length) S.marksDirty = true;   // the new name gets this phone's marks
      ST = r.state; skew = r.now - Date.now(); save(); lastPhaseShown = null; onPhase(ST.phase); render(); poll();
    } catch (e) { $('#jGo').disabled = false; toast('Could not reach the class game. Check your connection.'); }
  };
  $('#jSolo').onclick = () => { const n = $('#jName').value.trim().slice(0, 20); S = { practice: true, lastName: n || S.lastName }; save(); tab = 'files'; render(); };
}

/* Lobby: briefing */
function programmeBlock(){
  const P = SL.programme;
  return '<div class="lab" style="margin-top:14px">The programme</div><p style="margin-top:2px"><b>' + esc(P.name) + '</b>' + (P.university && !/^\(placeholder\)$/i.test(P.university) ? ' · ' + esc(P.university) : '') + '</p>' +
    '<p style="margin-top:4px">' + esc(P.brief) + '</p><div class="muted small" style="margin-top:6px">Applicants should connect to these three features:</div><ol style="padding-left:20px;margin-top:2px">' +
    P.features.map(x => '<li>' + esc(x) + '</li>').join('') + '</ol>';
}
function markList(){ return '<ul class="clean" style="margin-top:2px">' + SL.markTypes.map(m => '<li><span class="mchip m-' + m.id + '">' + m.icon + ' ' + esc(m.label) + '</span> ' + esc(m.look) + '</li>').join('') + '</ul>'; }
function briefing(){
  return '<div class="card"><div class="lab">Your briefing</div><h2 class="serif" style="margin-top:4px">' + esc(U.briefTitle) + '</h2>' +
    '<p style="margin-top:8px">' + esc(SL.meta.blurb) + '</p>' +
    '<div class="lab" style="margin-top:14px">' + esc(U.briefWhy) + '</div><ol style="padding-left:20px;margin-top:4px">' + SL.purposes.map(p => '<li>' + esc(p) + '</li>').join('') + '</ol>' +
    programmeBlock() +
    '<div class="lab" style="margin-top:14px">Three marks</div><p class="muted small">' + esc(U.marksIntro) + '</p>' + markList() +
    '<div class="lab" style="margin-top:14px">What a strong file shows</div><ul class="clean" style="margin-top:2px">' + SL.criteria.map(c => '<li><b>' + esc(c.name) + '.</b> ' + esc(c.look) + '</li>').join('') + '</ul>' +
    '<div class="lab" style="margin-top:14px">The rounds</div><ul class="clean" style="margin-top:2px">' + (U.rounds || []).map(r => '<li><b>' + esc(r.title) + '.</b> ' + esc(r.text) + '</li>').join('') + '</ul>' +
    '<div class="lab" style="margin-top:14px">Places and points</div><p>' + esc(U.places) + ' ' + esc(U.points) + '</p>' +
    '<button class="btn ghost small" style="margin-top:12px" data-help>Help: marks, clichés and the activity-line formula</button></div>';
}
function viewLobby(){
  return '<div class="card"><div class="row"><span class="pill green">Joined</span><span class="muted">' + esc(S.name) + ' · Panel ' + esc(S.panel) + '</span></div>' +
    '<p style="margin-top:10px"><b>' + esc(U.lobbyWait) + '</b></p>' +
    '<button class="btn ghost small" id="changeMe" style="margin-top:10px">Change name or panel</button></div>' + briefing();

  ta.addEventListener('drop', stop);
  ta.addEventListener('beforeinput', e => { if (/^insertFrom(Paste|Drop)/.test(e.inputType || '')) stop(e); });
  ta.addEventListener('contextmenu', e => e.preventDefault());
}
function bindFixEditor(){
  document.querySelectorAll('[data-tgt]:not([disabled])').forEach(b => b.onclick = () => { S.fix.target = b.dataset.tgt; save(); render(); const ta = $('#fixText'); if (ta) ta.focus(); });
  const ta = $('#fixText');
  if (ta) { blockPaste(ta); ta.oninput = () => { S.fix.texts[S.fix.target] = ta.value; save(); updateFixLive(); }; updateFixLive(); }
  if ($('#fixSend')) $('#fixSend').onclick = sendFix;
  if ($('#soloNameGo')) $('#soloNameGo').onclick = () => { const n = $('#soloName').value.trim().slice(0, 20); if (!n) return toast('Type your nickname first'); S.lastName = n; save(); render(); loadSoloFix(); };
  if ($('#soloFixAgain')) $('#soloFixAgain').onclick = () => { FIX = null; loadSoloFix(); render(); };
}
function bindFix(){ bindHelp(); bindFixEditor(); if ($('#claim')) $('#claim').onclick = () => claimHead(); }
async function sendFix(){
  const X = S.fix, f = BYID[X.fileId], t = targetsOf(f).find(x => x.id === X.target), text = (X.texts[X.target] || '').trim();
  if (!text) return toast('Type your version first.');
  const r = coreCheckFix(X.target, text, t.text);
  if (words(text) > t.max) return toast('Too long: at most ' + t.max + ' words.');
  if (r && !r.ok && !armed('fix')) return toast('Some checks are not ticked yet. Tap Send again to send anyway.');
  const body = { action: 'fix', name: S.practice ? S.lastName : S.name, panel: S.practice ? '' : S.panel, fileId: X.fileId, target: X.target, text, auto: false };
  if (!S.practice) body.epoch = S.epoch;
  $('#fixSend').disabled = true;
  try {
    const res = await api('POST', body);
    if (res && res.stale) return resetLocal('Your teacher started a new game.');
    if (res && res.ok) { X.sent = { target: X.target, text, at: Date.now() }; save(); toast('Fix-it sent'); focusAfter = '#fixSend'; render(); return; }
    toast(res && res.head ? res.head + ' is head of panel: only she sends in class.' : 'Not sent: ' + ((res && res.error) || 'try again'));
  } catch (e) { toast('No connection. Your text is saved on this phone. Try again.'); }
  if ($('#fixSend')) $('#fixSend').disabled = false;
}

/* Help sheet */
function bindHelp(){ document.querySelectorAll('[data-help]').forEach(b => b.onclick = openHelp); }
function openHelp(){
  const vb = SL.verbBank || [], groups = U.verbGroups || [];
  const vgHtml = groups.length ? groups.map((g, i) => '<div class="vg"><b>' + esc(g) + ':</b> ' + esc(vb.slice(i * 10, i * 10 + 10).join(', ')) + '</div>').join('') : '<div class="vg">' + esc(vb.join(', ')) + '</div>';
  const lc = SL.lineCheck || {};
  $('#sheetBox').innerHTML = '<div class="row" style="justify-content:space-between;flex-wrap:nowrap"><h2 class="serif">What to look for</h2><button class="iconbtn" id="closeSheet" aria-label="Close">✕</button></div>' +
    '<ul class="clean" style="margin-top:8px">' + SL.criteria.map(c => '<li><b>' + esc(c.name) + '.</b> ' + esc(c.look) + '</li>').join('') + '</ul>' +
    '<div class="lab" style="margin-top:16px">The three marks</div>' + markList() + '<p class="muted small">' + esc(U.marksIntro) + ' Tap the same mark again to clear it.</p>' +
    '<div class="lab" style="margin-top:16px;color:var(--red)">🚩 Reasons for a concern</div><ul class="clean">' + SL.concernReasons.map(f => '<li>' + esc(f) + '</li>').join('') + '</ul>' +
    '<p class="note">' + esc(U.careful) + '</p>' +
    '<details><summary>The cliché list (' + SL.banList.length + ') and what to write instead</summary><ul class="clean" style="margin-top:6px">' +
    SL.banList.map(b => '<li><b>' + esc(b.cliche) + '</b>' + (b.replacement ? '<div class="muted small">Instead: ' + esc(b.replacement) + '</div>' : '') + '</li>').join('') + '</ul></details>' +
    '<details><summary>The activity-line formula</summary><p style="margin-top:6px"><b>' + esc((SL.formula || []).join(' + ')) + '</b></p><p class="small" style="margin-top:4px">' + esc(U.formulaIntro) + '</p>' +
    '<ul class="clean small" style="margin-top:4px">' + [lc.verb, lc.number, lc.result].filter(Boolean).map(x => '<li>' + esc(x) + '</li>').join('') + '<li>At most ' + esc(lc.maxWords || 22) + ' words.</li></ul>' +
    '<div class="lab" style="margin-top:8px">The verb bank</div>' + vgHtml + '</details>' +
    '<div class="lab" style="margin-top:16px">Places and points</div><p>' + esc(U.places) + ' ' + esc(U.points) + '</p>';
  $('#sheet').classList.add('show'); $('#closeSheet').onclick = closeHelp; $('#closeSheet').focus();
}
let helpReturn = null;
function closeHelp(){ if (!$('#sheet').classList.contains('show')) return false; $('#sheet').classList.remove('show'); if (helpReturn) { try { helpReturn.focus(); } catch (e) {} helpReturn = null; } return true; }
$('#helpBtn').onclick = () => { helpReturn = $('#helpBtn'); openHelp(); };
$('#sheet').onclick = e => { if (e.target.id === 'sheet') closeHelp(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (!closeHelp() && S.openU) closeRow(); } });
document.addEventListener('visibilitychange', () => { if (document.hidden) { stopAudio(); sendMarks(false); } else poll(); });
window.addEventListener('pagehide', () => sendMarks(false));

/* boot */
render();
if (S.name && !S.practice) { poll(); }
if (S.practice && tab === 'fix') loadSoloFix();
</script>
</body>
</html>
